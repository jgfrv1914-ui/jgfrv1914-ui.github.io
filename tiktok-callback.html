<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Conexión con TikTok — Datos Curiosos Shorts</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; color: #222; }
  code { display: block; word-break: break-all; background: #f3f3f3; padding: 1rem; border-radius: 6px; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>Conexión con TikTok</h1>
  <p id="msg">Leyendo la respuesta de TikTok…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copiar código</button>
<script>
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  const box = document.getElementById("code");
  const btn = document.getElementById("copy");
  if (p.get("code")) {
    msg.textContent = "Cuenta autorizada. Copia este código y pégalo en la ventana del programa:";
    box.textContent = p.get("code");
    box.hidden = btn.hidden = false;
    btn.onclick = () => navigator.clipboard.writeText(box.textContent).then(() => btn.textContent = "Copiado");
  } else if (p.get("error")) {
    msg.textContent = "TikTok devolvió un error: " + p.get("error") + " " + (p.get("error_description") || "");
  } else {
    msg.textContent = "Esta página recibe la autorización de TikTok. No hay nada que mostrar.";
  }
</script>
</body>
</html>
